<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>VSL Biblioteca Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #081021;
    --navy: #0F1A33;
    --panel: #16223F;
    --line: #2A3A60;
    --silver: #D5DEEC;
    --text: #F1F4FA;
    --muted: #8E9BB8;
    --ice: #7FA8FF;
    --amber: #F4B63F;
    --red: #E0645A;
    --display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
    --body: "Source Sans 3", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 64px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 28px; }

  header.top { display: grid; gap: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); font-weight: 700; }
  h1 {
    font-family: var(--display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(34px, 6vw, 62px); line-height: .95; margin: 0; letter-spacing: .01em;
    text-wrap: balance;
  }
  h1 span { color: var(--amber); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; }
  .meta b { color: var(--silver); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---------- Player ---------- */
  .player { display: grid; gap: 12px; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%;
    background: radial-gradient(120% 90% at 70% 10%, #13224A 0%, var(--navy) 45%, #060C1A 100%);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    container-type: inline-size;
  }
  .stage:fullscreen { border-radius: 0; border: 0; }
  .frame { position: absolute; inset: 0; transition: opacity .35s ease; }
  .frame.fading { opacity: 0; }
  .frame > svg, .thumb > svg { display: block; width: 100%; height: 100%; }
  .frame > svg.ovl { position: absolute; left: 0; top: 0; pointer-events: none; }
  #caption > :empty { display: none; }
  svg text { font-family: var(--body); }
  svg .d { font-family: var(--display); font-weight: 800; letter-spacing: .01em; }
  svg .m { font-family: var(--mono); font-weight: 700; }

  .rv { opacity: 0; transform: translateY(14px); transform-box: fill-box; transition: opacity .55s ease, transform .55s ease; }
  .rv.on, .all .rv { opacity: 1; transform: none; }
  .spin { animation: spin 6s linear infinite; }
  .spin-fast { animation: spin 1.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bob { animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(16px); } }
  .pulse { animation: pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .all .spin, .all .spin-fast, .all .bob, .all .pulse { animation: none; }
  .kb { animation: kb 26s linear both; transform-box: fill-box; transform-origin: 50% 45%; }
  @keyframes kb { from { transform: scale(1); } to { transform: scale(1.12); } }
  .fvid { position: absolute; object-fit: cover; border-radius: 1.1cqw; border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 2cqw 5cqw rgba(0,0,0,.55); background: #000; }

  .chap {
    position: absolute; left: 2.2cqw; top: 2cqw; display: flex; gap: .8cqw; align-items: center;
    font-size: 1.35cqw; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    color: var(--silver); background: rgba(8,16,33,.72); border: 1px solid var(--line);
    padding: .5cqw 1.1cqw; border-radius: 99px;
  }
  .chap i { width: .8cqw; height: .8cqw; border-radius: 50%; background: var(--red); display: block; }
  .caption {
    position: absolute; left: 50%; bottom: 3cqw; transform: translateX(-50%);
    width: min(86%, 86cqw); text-align: center; pointer-events: none;
  }
  .caption span {
    display: inline; font-size: 2.55cqw; line-height: 1.45; font-weight: 600; color: #fff;
    background: rgba(3,7,16,.82); padding: .25cqw .8cqw; border-radius: .5cqw;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
  }
  .caption span b { color: var(--amber); font-weight: 700; }
  .stage.nocap .caption { display: none; }
  .bigplay {
    position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,12,26,.35);
    border: 0; cursor: pointer; color: var(--ink);
  }
  .bigplay span {
    display: flex; align-items: center; gap: 1.2cqw; background: var(--amber); border-radius: 99px;
    padding: 1.4cqw 2.8cqw 1.4cqw 2.2cqw; font-family: var(--display); font-weight: 800;
    font-size: 2.6cqw; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.45);
  }
  .bigplay svg { width: 2.4cqw; height: 2.4cqw; }
  .bigplay:focus-visible span { outline: 3px solid #fff; outline-offset: 4px; }

  .timeline { display: flex; gap: 3px; height: 30px; align-items: stretch; }
  .seg {
    position: relative; border: 0; padding: 0; background: var(--panel); border-radius: 4px; cursor: pointer;
    overflow: hidden; min-width: 8px;
  }
  .seg .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ice); opacity: .9; }
  .seg .n { position: relative; font-size: 11px; font-weight: 700; color: var(--silver); font-variant-numeric: tabular-nums; }
  .seg.cur { outline: 2px solid var(--amber); outline-offset: 1px; }
  .seg:focus-visible { outline: 2px solid #fff; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    font: 600 14px/1 var(--body); cursor: pointer;
  }
  .btn:hover { border-color: var(--ice); }
  .btn:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .btn.primary { background: var(--amber); color: var(--ink); border-color: var(--amber); }
  .btn[aria-pressed="true"] { border-color: var(--ice); color: var(--ice); }
  .btn svg { width: 16px; height: 16px; }
  .time { font: 500 14px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; }

  /* ---------- Storyboard ---------- */
  h2 {
    font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 34px;
    margin: 12px 0 0; letter-spacing: .02em;
  }
  .intro { color: var(--muted); max-width: 68ch; margin: 0; }
  .board { display: grid; gap: 18px; }
  .card {
    display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px;
    padding: 18px; background: var(--navy); border: 1px solid var(--line); border-radius: 14px;
  }
  .thumbs { display: grid; gap: 8px; align-content: start; }
  .thumb {
    aspect-ratio: 16/9; max-width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--line);
    background: radial-gradient(120% 90% at 70% 10%, #13224A 0%, var(--navy) 45%, #060C1A 100%);
    cursor: pointer; padding: 0;
  }
  .thumb:focus-visible { outline: 2px solid var(--amber); }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .card h3 {
    font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 26px; margin: 0;
    letter-spacing: .02em;
  }
  .tc { font: 500 13px var(--mono); color: var(--amber); font-variant-numeric: tabular-nums; }
  .bn { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .lab { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ice); font-weight: 700; margin: 14px 0 4px; }
  .dir { color: var(--silver); font-style: italic; margin: 0; }
  .narr { margin: 0; color: var(--text); max-width: 68ch; }
  .narr p { margin: 0 0 6px; }
  .edit { margin: 0; color: var(--muted); max-width: 68ch; }
  .notes { background: var(--navy); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; }
  .notes ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; color: var(--silver); }

  @media (max-width: 760px) {
    .card { grid-template-columns: 1fr; }
    .timeline .n { display: none; }
    .hint { display: none; }
  }
  .render-mode body { padding: 0; margin: 0; }
  .render-mode .wrap { max-width: none; display: block; }
  .render-mode header.top, .render-mode .timeline, .render-mode .controls, .render-mode .bigplay { display: none !important; }
  .render-mode .stage { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; }
  .render-mode .frame { transition: none; }
  .render-v body { width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(120% 70% at 50% 40%, #13224A 0%, var(--navy) 50%, #060C1A 100%); }
  .render-v .stage { position: absolute; top: 590px; left: 0; width: 1080px; height: 608px; }
  .render-v .vtop { position: absolute; top: 170px; left: 60px; right: 60px; text-align: center; display: grid; gap: 22px; }
  .render-v .vtop .eyebrow { font-size: 26px; }
  .render-v .vtop h1 { font-size: 74px; line-height: .98; }
  .render-v .vtop p { margin: 0; color: var(--silver); font-size: 30px; font-weight: 600; }
  .render-v #caption { position: absolute; top: 1270px; bottom: auto; left: 60px; width: 960px; transform: none; }
  .render-v #caption span { font-size: 54px; line-height: 1.38; padding: 4px 16px; border-radius: 10px; }
  @media (prefers-reduced-motion: reduce) {
    .rv, .frame { transition: none; }
    .spin, .spin-fast, .bob, .pulse, .kb { animation: none; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Instituto Gallo Personal</div>
    <h1>Biblioteca de Treinos Lucrativos e Personalizáveis <span>Pro™</span></h1>
  </header>

  <section class="player" aria-label="Player da VSL">
    <div class="stage" id="stage">
      <div class="frame" id="frame"></div>
      <div class="caption" id="caption" aria-live="polite"><span></span></div>
      <button class="bigplay" id="bigplay" aria-label="Assistir a VSL">
        <span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>Assistir</span>
      </button>
    </div>
    <div class="timeline" id="timeline" role="group" aria-label="Blocos da VSL"></div>
    <div class="controls">
      <button class="btn primary" id="play" aria-label="Reproduzir"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M6 4l15 8-15 8z"/></svg><span id="playLabel">Play</span></button>
      <button class="btn" id="prev" aria-label="Frase anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn" id="next" aria-label="Próxima frase"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <span class="time" id="time">00:00 / 00:00</span>
      <span class="spacer"></span>
      <button class="btn" id="voice" aria-pressed="true">Narração</button>
      <button class="btn" id="music" aria-pressed="true">Trilha</button>
      <button class="btn" id="cc" aria-pressed="true">Legendas</button>
      <button class="btn" id="fs">Tela cheia</button>
    </div>
  </section>

</div>

<script>
(() => {
  // ---------- SVG helpers ----------
  const C = { ink:'#081021', navy:'#0F1A33', panel:'#16223F', line:'#2A3A60', silver:'#D5DEEC', text:'#F1F4FA', muted:'#8E9BB8', ice:'#7FA8FF', amber:'#F4B63F', red:'#E0645A', paper:'#EEF2F8' };
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const rv = at => at == null ? '' : ` class="rv" data-at="${at}"`;
  const T = (x, y, s, o = {}) => {
    const { size = 28, fill = C.text, anchor = 'start', at, cls = '', weight = '', style = '' } = o;
    const k = [cls, at != null ? 'rv' : ''].filter(Boolean).join(' ');
    return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}"${k ? ` class="${k}"` : ''}${at != null ? ` data-at="${at}"` : ''}${weight ? ` font-weight="${weight}"` : ''}${style ? ` style="${style}"` : ''}>${esc(s)}</text>`;
  };
  const G = (at, inner, extra = '') => `<g${rv(at)} ${extra}>${inner}</g>`;
  const wrap = (text, max) => {
    const out = []; let cur = '';
    text.split(' ').forEach(w => { if ((cur + ' ' + w).trim().length > max) { out.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) out.push(cur); return out;
  };
  const TL = (x, y, lines, o = {}) => {
    const { size = 26, lh = 1.3, fill = C.text, weight = '', anchor = 'start', cls = '' } = o;
    return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}"${weight ? ` font-weight="${weight}"` : ''}${cls ? ` class="${cls}"` : ''}>` +
      lines.map((l, i) => `<tspan x="${x}" dy="${i ? size * lh : 0}">${esc(l)}</tspan>`).join('') + `</text>`;
  };
  const chipW = (label, size) => Math.round(label.length * size * 0.54 + size * 1.7);
  const chip = (x, y, label, o = {}) => {
    const { size = 24, fill = C.panel, stroke = C.line, color = C.silver } = o;
    const w = chipW(label, size), h = Math.round(size * 1.9);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>` +
      `<text x="${x + w / 2}" y="${y + h / 2 + size * 0.36}" font-size="${size}" fill="${color}" text-anchor="middle" font-weight="600">${esc(label)}</text>`;
  };
  const chipRow = (labels, y, o = {}, gap = 14) => {
    const size = o.size || 24;
    const ws = labels.map(l => chipW(l, size));
    const tot = ws.reduce((a, b) => a + b, 0) + gap * (labels.length - 1);
    let x = o.x != null ? o.x : (1600 - tot) / 2;
    return labels.map((l, i) => { const s = chip(x, y, l, o); x += ws[i] + gap; return s; }).join('');
  };
  const check = (x, y, s = 1, col = C.amber) =>
    `<g transform="translate(${x} ${y}) scale(${s})"><circle cx="16" cy="16" r="16" fill="${col}"/><path d="M8 16.5l5.5 5.5L24.5 10.5" fill="none" stroke="${C.ink}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const pdfIcon = (x, y, w, h, col = C.silver, band = C.ice) => {
    const f = Math.min(w, h) * 0.28;
    return `<path d="M${x} ${y}h${w - f}l${f} ${f}v${h - f}h-${w}z" fill="${col}"/>` +
      `<path d="M${x + w - f} ${y}v${f}h${f}" fill="#B9C5DA"/>` +
      `<rect x="${x + w * .16}" y="${y + h * .42}" width="${w * .68}" height="${h * .08}" rx="2" fill="${band}"/>` +
      `<rect x="${x + w * .16}" y="${y + h * .6}" width="${w * .5}" height="${h * .06}" rx="2" fill="#9AA8C2"/>` +
      `<rect x="${x + w * .16}" y="${y + h * .74}" width="${w * .58}" height="${h * .06}" rx="2" fill="#9AA8C2"/>`;
  };
  const svg = inner => `<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
  const ovl = inner => svg(inner).replace('<svg ', '<svg class="ovl" ');

  // ---------- Photo helpers ----------
  // photo: draws an image into box [x,y,w,h], cropped to crop=[cx,cy,cw,ch] (image pixels), optional slow zoom
  const photo = (href, iw, ih, crop, box, kb) => {
    const [x, y, w, h] = box, [cx, cy, cw, ch] = crop || [0, 0, iw, ih];
    return `<svg x="${x}" y="${y}" width="${w}" height="${h}" viewBox="${cx} ${cy} ${cw} ${ch}" preserveAspectRatio="xMidYMid slice">` +
      `<g${kb ? ' class="kb"' : ''}><image href="${href}" width="${iw}" height="${ih}"/></g></svg>`;
  };
  // backdrop: blurred, darkened full-frame version of an image
  const backdrop = (uid, href, iw, ih, crop, op = 0.5) =>
    `<defs><filter id="bl${uid}" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="26"/></filter></defs>` +
    `<g filter="url(#bl${uid})" opacity="${op}">${photo(href, iw, ih, crop, [-60, -60, 1720, 1020])}</g>` +
    `<rect width="1600" height="900" fill="#060C1A" opacity=".45"/>`;
  // poster: sharp rounded image with slow zoom
  const poster = (uid, href, iw, ih, px, py, ph) => {
    const pw = Math.round(ph * iw / ih);
    return `<defs><clipPath id="pc${uid}"><rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="18"/></clipPath></defs>` +
      `<rect x="${px + 10}" y="${py + 18}" width="${pw}" height="${ph}" rx="18" fill="#000" opacity=".45"/>` +
      `<g clip-path="url(#pc${uid})">${photo(href, iw, ih, null, [px, py, pw, ph], true)}</g>` +
      `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="18" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="2"/>`;
  };
  const shade = (uid, dir = 'b') => dir === 'b'
    ? `<defs><linearGradient id="sh${uid}" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#060C1A" stop-opacity="0"/><stop offset="1" stop-color="#060C1A" stop-opacity=".92"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sh${uid})"/>`
    : `<defs><linearGradient id="sl${uid}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#060C1A" stop-opacity=".92"/><stop offset=".6" stop-color="#060C1A" stop-opacity=".55"/><stop offset="1" stop-color="#060C1A" stop-opacity=".1"/></linearGradient></defs><rect width="1600" height="900" fill="url(#sl${uid})"/>`;
  const vid = (src, x, y, w, h, extra = '') =>
    `<video class="fvid" muted playsinline preload="auto" style="left:${x / 16}%;top:${y / 9}%;width:${w / 16}%;height:${h / 9}%;${extra}">` +
    `<source src="${src}.webm" type="video/webm"><source src="${src}.mp4" type="video/mp4"></video>`;

  // ---------- Scene illustrations ----------
  const S = {
    gancho: (uid) => svg(
      photo('img/b1-personal-noite.jpg', 1254, 1254, [0, 110, 1254, 705], [0, 0, 1600, 900], true) +
      shade(uid, 'b') +
      G(4, `<rect x="560" y="628" width="480" height="4" rx="2" fill="${C.amber}"/>` +
        T(800, 710, 'ISSO ACABA HOJE.', { size: 84, anchor: 'middle', cls: 'd', fill: C.amber }))
    ),

    dor: () => {
      const panel = (x, title, at) => G(at, `<rect x="${x}" y="110" width="440" height="500" rx="20" fill="${C.panel}" stroke="${C.line}" stroke-width="3"/>` +
        T(x + 220, 160, title, { size: 26, anchor: 'middle', fill: C.silver, weight: 700 }));
      return svg(
        panel(80, '22h · do zero', 1) +
        G(1, `<circle cx="450" cy="230" r="34" fill="#E9E3C9"/><circle cx="466" cy="220" r="30" fill="${C.panel}"/>` +
          [[140, 210], [190, 250], [390, 300], [160, 290]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="${C.silver}"/>`).join('') +
          `<rect x="150" y="300" width="300" height="190" rx="12" fill="#0B1428" stroke="${C.muted}" stroke-width="4"/>` +
          `<path d="M120 500h360l-24 28H144z" fill="${C.muted}"/>` +
          T(175, 335, 'Série  Reps  Carga', { size: 18, fill: C.ice, cls: 'm' }) +
          [0, 1, 2, 3].map(i => `<rect x="175" y="${352 + i * 30}" width="${[220, 180, 240, 120][i]}" height="12" rx="6" fill="#33456E"/>`).join('')) +
        G(2, `<g transform="rotate(-8 300 560)"><rect x="150" y="530" width="300" height="60" rx="8" fill="none" stroke="${C.red}" stroke-width="5"/>` +
          T(300, 572, 'DO ZERO. DE NOVO.', { size: 30, anchor: 'middle', cls: 'd', fill: C.red }) + `</g>`) +

        panel(580, 'o mesmo modelo para todos', 3) +
        G(3, [2, 1, 0].map(i => `<g transform="translate(${650 + i * 40} ${200 + i * 36})"><rect width="220" height="280" rx="8" fill="${[C.paper, '#D9E1EE', '#C3CEDF'][i]}" stroke="#9AA8C2"/>` +
          `<rect width="220" height="44" rx="8" fill="#9AA8C2"/>` +
          `<text x="14" y="30" font-size="20" font-weight="700" fill="${C.ink}">Aluno ${['A', 'B', 'C'][i]}</text>` +
          [0, 1, 2, 3, 4].map(j => `<rect x="14" y="${66 + j * 36}" width="${[170, 140, 180, 120, 160][j]}" height="12" rx="6" fill="#A9B6CC"/>`).join('') + `</g>`).join('')) +
        G(4, T(800, 585, '“ninguém vai perceber…”', { size: 26, anchor: 'middle', fill: C.muted, style: 'font-style:italic' })) +

        panel(1080, 'largado no arquivo', 5) +

  // ---------- Narration: audio chunks + per-line start times (aligned to the pauses in the voice) ----------
  const AUDIO = [{"file": "audio/b01.mp3", "blocks": [1], "dur": 22.682, "starts": [0.0, 2.09, 9.57, 14.2, 18.4]}, {"file": "audio/b02.mp3", "blocks": [2], "dur": 41.804, "starts": [0.0, 1.57, 8.71, 14.87, 20.71, 24.57, 30.08, 34.39, 38.94]}, {"file": "audio/b03.mp3", "blocks": [3], "dur": 49.852, "starts": [0.0, 2.94, 10.52, 17.3, 20.22, 26.0, 34.3, 38.7, 42.18, 46.12]}, {"file": "audio/b04.mp3", "blocks": [4], "dur": 40.88, "starts": [0.0, 3.72, 9.74, 10.65, 14.89, 18.39, 23.45, 25.75, 31.65, 35.35]}, {"file": "audio/b05.mp3", "blocks": [5], "dur": 42.633, "starts": [0.0, 2.06, 6.43, 12.28, 17.21, 19.68, 27.21, 33.1, 36.79]}, {"file": "audio/b06.mp3", "blocks": [6], "dur": 36.69, "starts": [0.0, 1.94, 5.94, 8.0, 12.31, 15.49, 20.44, 28.71]}, {"file": "audio/b07.mp3", "blocks": [7], "dur": 35.043, "starts": [0.0, 1.47, 8.73, 10.84, 15.43, 20.57, 22.21, 26.94, 28.82]}, {"file": "audio/b08.mp3", "blocks": [8], "dur": 23.375, "starts": [0.0, 4.44, 8.21, 11.5, 15.38, 18.45]}, {"file": "audio/b09.mp3", "blocks": [9], "dur": 23.619, "starts": [0.0, 6.06, 10.0, 15.14, 17.67]}, {"file": "audio/b10.mp3", "blocks": [10], "dur": 13.528, "starts": [0.0, 3.3, 5.57, 12.18]}];
  const plain = s => s.replace(/<[^>]+>/g, '');
  const LINES = []; let t = 0, frameCount = 0;
  const flat = BLOCKS.flatMap((b, bi) => b.frames.flatMap((f, fi) => f.lines.map((html, li) => ({ bi, fi, li, html, text: plain(html) }))));
  BLOCKS.forEach(b => frameCount += b.frames.length);
  AUDIO.forEach(c => {
    c.off = t;
    c.starts.forEach((s, i) => {
      const L = flat[LINES.length];
      const end = i + 1 < c.starts.length ? c.starts[i + 1] : c.dur;
      LINES.push({ ...L, start: t + s, dur: end - s, chunk: AUDIO.indexOf(c) });
    });
    t += c.dur;
  });
  BLOCKS.forEach((b, bi) => {
    const ls = LINES.filter(L => L.bi === bi);
    b.start = ls[0].start; b.dur = ls[ls.length - 1].start + ls[ls.length - 1].dur - b.start;
  });
  const TOTAL = t;
  const fmt = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  // ---------- Elements ----------
  const $ = id => document.getElementById(id);
  const stage = $('stage'), frameEl = $('frame'), capEl = $('caption').firstElementChild;
  let uid = 0;
  const render = key => S[key](++uid);

  // timeline
  const segs = BLOCKS.map(b => {
    const el = document.createElement('button');
    el.className = 'seg'; el.style.flex = b.dur.toFixed(2);
    el.setAttribute('aria-label', `Bloco ${b.n}: ${b.t}`);
    el.innerHTML = `<span class="fill"></span>`;
    el.addEventListener('click', () => seek(b.start, true));
    $('timeline').appendChild(el);
    return el;
  });

  // ---------- Background music (generated live with Web Audio: soft pad, A minor) ----------
  const Music = (() => {
    let ctx = null, master = null, timer = null, nextAt = 0, step = 0, on = true;
    const CHORDS = [[45, 52, 57, 60], [41, 48, 53, 57], [48, 55, 60, 64], [43, 50, 55, 59]]; // Am F C G
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const LEN = 4.2;
    function chord(at, notes) {
      notes.forEach((m, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = hz(m); o.detune.value = (i % 2 ? 4 : -4);
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(i === 0 ? 0.5 : 0.22, at + 1.4);
        g.gain.setValueAtTime(i === 0 ? 0.5 : 0.22, at + LEN - 0.4);
        g.gain.linearRampToValueAtTime(0, at + LEN + 1.2);
        o.connect(g).connect(master); o.start(at); o.stop(at + LEN + 1.3);
      });
    }
    function schedule() { while (nextAt < ctx.currentTime + 1.5) { chord(nextAt, CHORDS[step++ % 4]); nextAt += LEN; } }
    return {
      play() {
        if (!on) return;
        try {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
            master = ctx.createGain(); master.gain.value = 0.05; master.connect(lp).connect(ctx.destination);
          }
          ctx.resume(); nextAt = Math.max(nextAt, ctx.currentTime + 0.05); schedule();
          clearInterval(timer); timer = setInterval(schedule, 500);
        } catch (e) {}
      },
      pause() { clearInterval(timer); try { ctx && ctx.suspend(); } catch (e) {} },
      set(v) { on = v; if (!v) this.pause(); },
      level(narrating) { if (master) master.gain.setTargetAtTime(narrating ? 0.05 : 0.11, ctx.currentTime, 0.3); }
    };
  })();

  // ---------- Playback ----------
  let cur = -1, curFrameKey = '', playing = false, pos = 0, last = 0;
  let voiceOn = true, musicOn = true, active = -1; // active = audio chunk currently playing
  AUDIO.forEach(c => {
    c.el = new Audio(); c.el.preload = 'auto';
    c.el.addEventListener('error', () => { c.bad = true; });
    // Load into memory so seeking works on any host; fall back to the plain file URL.
    fetch(c.file).then(r => r.ok ? r.blob() : Promise.reject()).then(bl => { c.el.src = URL.createObjectURL(bl); })
      .catch(() => { c.el.src = c.file; });
  });

  const idxAt = p => { let i = 0; while (i < LINES.length - 1 && LINES[i + 1].start <= p + 1e-6) i++; return i; };
  const chunkAt = p => { let k = 0; while (k < AUDIO.length - 1 && AUDIO[k + 1].off <= p + 1e-6) k++; return k; };

  function stopAudio() { AUDIO.forEach(c => { try { c.el.pause(); } catch (e) {} }); active = -1; }
  function startAudio() {
    stopAudio();
    if (!voiceOn || !playing) return;
    const k = chunkAt(pos), c = AUDIO[k];
    if (c.bad) return;
    const go = () => {
      if (!playing || !voiceOn || chunkAt(pos) !== k) return;
      try {
        c.el.currentTime = Math.max(0, pos - c.off);
        const r = c.el.play(); active = k;
        if (r && r.catch) r.catch(() => { active = -1; });
      } catch (e) { active = -1; }
    };
    if (c.el.readyState >= 1) go(); else c.el.addEventListener('loadedmetadata', go, { once: true });
  }

  function showLine(i) {
    const L = LINES[i], b = BLOCKS[L.bi], f = b.frames[L.fi];
    const key = L.bi + ':' + L.fi;
    const apply = () => frameEl.querySelectorAll('.rv').forEach(el => el.classList.toggle('on', +el.dataset.at <= L.li));
    if (key !== curFrameKey) {
      curFrameKey = key;
      frameEl.classList.add('fading');
      setTimeout(() => {
        frameEl.innerHTML = render(f.s);
        frameEl.classList.remove('fading');
        const v = frameEl.querySelector('video');
        if (v) { v.currentTime = Math.max(0, pos - LINES.find(x => x.bi === L.bi && x.fi === L.fi).start); if (playing) v.play().catch(() => {}); }
        requestAnimationFrame(() => requestAnimationFrame(apply));
      }, cur >= 0 ? 220 : 0);
    } else apply();
    capEl.innerHTML = BLOCKS[L.bi].nocap ? '' : L.html;
    segs.forEach((s, j) => s.classList.toggle('cur', j === L.bi));
    cur = i;
  }

  function paint() {
    BLOCKS.forEach((b, j) => {
      const r = Math.min(1, Math.max(0, (pos - b.start) / b.dur));
      segs[j].firstElementChild.style.width = (r * 100) + '%';
    });
    $('time').textContent = `${fmt(pos)} / ${fmt(TOTAL)}`;
  }

  function seek(p, keepPlaying) {
    pos = Math.min(Math.max(0, p), TOTAL - 0.01);
    const i = idxAt(pos);
    if (i !== cur) showLine(i);
    paint();
    if (!keepPlaying) setPlaying(false); else if (playing) startAudio();
  }

  function tick(now) {
    if (!playing) return;
    const dt = Math.min(0.25, (now - last) / 1000); last = now;
    if (active >= 0) {
      const c = AUDIO[active];
      if (c.el.ended || c.el.currentTime >= c.dur - 0.03) {
        pos = c.off + c.dur;
        if (active + 1 < AUDIO.length) { pos += 0.001; startAudio(); } else active = -1;
      } else pos = c.off + c.el.currentTime; // the voice is the clock
    } else pos += dt;
    if (pos >= TOTAL) { pos = TOTAL - 0.01; paint(); setPlaying(false); return; }
    const i = idxAt(pos);
    if (i !== cur) showLine(i);
    paint();
    requestAnimationFrame(tick);
  }

  function setPlaying(v) {
    if (v && pos >= TOTAL - 0.05) { pos = 0; showLine(0); }
    playing = v;
    $('bigplay').hidden = v;
    $('playLabel').textContent = v ? 'Pausa' : 'Play';
    $('play').setAttribute('aria-label', v ? 'Pausar' : 'Reproduzir');

    if (v) {
      last = performance.now(); startAudio();
      if (musicOn) { Music.play(); Music.level(voiceOn); }
      requestAnimationFrame(tick);
      frameEl.querySelectorAll('video').forEach(v => v.play().catch(() => {}));
    } else { stopAudio(); Music.pause(); frameEl.querySelectorAll('video').forEach(v => v.pause()); }
  }

  $('next').addEventListener('click', () => seek(LINES[Math.min(LINES.length - 1, cur + 1)].start, playing));
  toggle('cc', on => stage.classList.toggle('nocap', !on));
  toggle('voice', on => { voiceOn = on; if (playing) { if (on) startAudio(); else stopAudio(); Music.level(on); } });
  toggle('music', on => { musicOn = on; Music.set(on); if (on && playing) { Music.play(); Music.level(voiceOn); } });
  $('fs').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();

    } catch (e) {}
  });
  document.addEventListener('keydown', e => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }

  // ---------- Render mode (MP4 export): draws the exact frame for time t ----------
  if (location.hash === '#render' || location.hash === '#render-v') {
    document.documentElement.classList.add('render-mode');

    }

    const ease = p => 1 - Math.pow(1 - p, 3);
    window.__TOTAL = TOTAL;
    window.__renderAt = t => {
      const L = LINES[idxAt(t)], f = BLOCKS[L.bi].frames[L.fi], key = L.bi + ':' + L.fi;
      if (key !== rKey) {
        rKey = key; frameEl.innerHTML = render(f.s);
        rLines = LINES.filter(x => x.bi === L.bi && x.fi === L.fi); rStart = rLines[0].start;
      }
      frameEl.style.opacity = Math.max(0, Math.min(1, (t - rStart) / 0.35));
      frameEl.querySelectorAll('.rv').forEach(el => {
        const ln = rLines[+el.dataset.at];
        const t0 = (ln ? ln.start : Infinity) + (parseFloat(el.style.transitionDelay) || 0) / 1000;
        const p = ease(Math.max(0, Math.min(1, (t - t0) / 0.55)));
        el.style.transition = 'none'; el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 14}px)`;
      });
      frameEl.querySelectorAll('.spin, .spin-fast, .bob, .pulse, .kb').forEach(el => {
        el.style.animationPlayState = 'paused'; el.style.animationDelay = `${-(t - rStart)}s`;
      });

      const v = frameEl.querySelector('video');
      if (!v) return;
      return (async () => {
        if (v.readyState < 2) await new Promise(r => { v.addEventListener('loadeddata', r, { once: true }); setTimeout(r, 3000); });
        const want = Math.max(0, Math.min(t - rStart, (v.duration || 5) - 0.05));
        if (Math.abs(v.currentTime - want) > 0.001) {
          await new Promise(r => { v.addEventListener('seeked', r, { once: true }); v.currentTime = want; setTimeout(r, 2000); });
        }
      })();
    };
  }

  seek(0, false);
})();
